<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050914">
  <meta name="robots" content="noindex, follow">
  <title>404 — Page Not Found | Ventorea Studios</title>
  <style>
    :root{color-scheme:dark;--bg:#050914;--panel:#0b1322;--text:#f0eee7;--muted:#9babbf;--blue:#8bc5ff;--line:#26334a}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 28%,rgba(36,91,158,.22),transparent 48%),linear-gradient(145deg,#050914,#080e1b 58%,#050914);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{width:min(100%,760px);text-align:center}
    .brand{display:inline-flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:2.6px}
    .mark{display:grid;place-items:center;width:35px;height:35px;border:1px solid rgba(139,197,255,.5);border-radius:10px;color:var(--blue);font-size:18px;background:linear-gradient(145deg,rgba(43,103,194,.24),rgba(13,24,43,.9))}
    .eyebrow{margin:54px 0 12px;color:var(--blue);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.4px}
    h1{margin:0;font-size:clamp(88px,20vw,156px);line-height:.92;letter-spacing:-.09em;font-weight:750;background:linear-gradient(180deg,#fff 10%,#8bc5ff 72%,#4679b9);-webkit-background-clip:text;background-clip:text;color:transparent}
    h2{margin:27px 0 12px;font-size:clamp(24px,5vw,36px);letter-spacing:-1.2px;font-weight:600}
    .copy{max-width:470px;margin:0 auto;color:var(--muted);font-size:15px;line-height:1.8}
    .path{display:inline-block;max-width:100%;overflow-wrap:anywhere;margin-top:22px;padding:9px 13px;border:1px solid var(--line);border-radius:5px;color:#a9cfff;background:rgba(9,17,31,.72);font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:29px}
    .button{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:0 19px;border:1px solid rgba(139,197,255,.55);border-radius:5px;background:linear-gradient(135deg,rgba(43,103,194,.4),rgba(13,24,43,.94));color:#f5f8ff;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:1px;transition:transform .2s,border-color .2s}
    .button:hover{transform:translateY(-2px);border-color:var(--blue)}
    .button.secondary{background:transparent;border-color:var(--line);color:var(--muted)}
    footer{margin-top:64px;padding-top:20px;border-top:1px solid rgba(38,51,74,.75);color:#73839a;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  
/* Homepage-aligned Ventorea logo and blue ambient lighting. */
.brand{display:inline-flex;align-items:center;gap:11px;color:#f3f7ff;text-decoration:none}.brand-logo{display:block;width:52px;height:52px;max-width:52px;max-height:52px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(77,163,255,.28))}.brand-wordmark{display:flex;flex-direction:column;line-height:.92;white-space:nowrap}.brand-wordmark b{font:700 23px/1 Arial,sans-serif;letter-spacing:-1px;color:#f3f7ff}.brand-wordmark small{margin-top:5px;font:600 9px/1 monospace;letter-spacing:4px;color:#c5d6eb}.brand-wordmark i{font-style:normal;color:#a8d5ff;text-shadow:0 0 6px #4da3ff,0 0 15px rgba(77,163,255,.8)}@media(max-width:480px){.brand-logo{width:42px;height:42px;max-width:42px;max-height:42px}.brand-wordmark b{font-size:18px}.brand-wordmark small{font-size:8px;letter-spacing:3px}}
</style>
</head>
<body>
  <main class="shell">
    <a class="brand" href="/" aria-label="Ventorea Studios home"><img class="brand-logo" src="/Ventorea%20Studios.jpg" alt=""><span class="brand-wordmark"><b><i>V</i>entorea</b><small><i>S</i>TUDIOS</small></span></a>
    <p class="eyebrow">404 / PAGE NOT FOUND</p>
    <h1>404</h1>
    <h2>This page doesn't exist.</h2>
    <p class="copy">The address might be incorrect, or the page might have moved. Let's get you back to the world we’re building.</p>
    <div class="path" id="requestedPath"></div>
    <div class="actions">
      <a class="button" href="/">RETURN TO HOMEPAGE <span aria-hidden="true">&nbsp;↗</span></a>
      <a class="button secondary" href="/Contact/">CONTACT THE STUDIO</a>
    </div>
    <footer>NEW WORLD. NEW LIFESTYLE. &nbsp;·&nbsp; © 2026 VENTOREA STUDIOS</footer>
  </main>
  <script>
    const path = window.location.pathname;
    document.getElementById('requestedPath').textContent = path && path !== '/' ? path : 'Unknown page';
  </script>
</body>
</html>
